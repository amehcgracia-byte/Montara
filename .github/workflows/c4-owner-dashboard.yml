name: C4 private owner project dashboard

on:
  push:
    branches:
      - fernando/c4-owner-dashboard-20261109
  pull_request:
    paths:
      - 'urano/owner_dashboard.py'
      - 'urano/minimal_owner_api.py'
      - 'tests/test_c4_owner_dashboard.py'
      - '.github/workflows/c4-owner-dashboard.yml'

permissions:
  contents: read

jobs:
  c4-authenticated-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing identity test dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify C1 compatibility and C4 dashboard isolation
        run: |
          python -m unittest discover -s tests -p 'test_c1_minimal_owner_api.py' -v
          python -m unittest discover -s tests -p 'test_c4_owner_dashboard.py' -v
          python -m py_compile urano/owner_dashboard.py urano/minimal_owner_api.py
