name: C8 Google owner beta UI bridge

on:
  push:
    branches:
      - fernando/c8-google-owner-ui-bridge-20261110
    paths:
      - 'urano/owner_beta_wsgi.py'
      - 'tests/test_c8_google_owner_ui_bridge.py'
      - 'docs/montara-c8-google-owner-bridge.md'
      - '.github/workflows/c8-google-owner-bridge.yml'
  pull_request:
    paths:
      - 'urano/owner_beta_wsgi.py'
      - 'tests/test_c8_google_owner_ui_bridge.py'
      - '.github/workflows/c8-google-owner-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-owner-ui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing isolated owner API test requirements
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify private Google login and owner navigation
        run: |
          python -m unittest discover -s tests -p 'test_c8_google_owner_ui_bridge.py' -v
          python -m unittest discover -s tests -p 'test_c1_minimal_owner_api.py' -v
          python -m unittest discover -s tests -p 'test_c4_owner_dashboard.py' -v
          python -m py_compile urano/owner_beta_wsgi.py
