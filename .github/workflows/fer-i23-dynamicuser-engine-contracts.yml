name: FER I23 DynamicUser Engine bundle offline contracts
on:
  pull_request:
    paths:
      - 'tests/urano_i23_dynamicuser_engine_lab.py'
      - 'tests/test_urano_i23_dynamicuser_engine_lab.py'
      - '.github/workflows/fer-i23-dynamicuser-engine-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static security contracts, no host services started
        env:
          PYTHONPATH: tests
        run: |
          python -m unittest discover -s tests -p 'test_urano_i23_dynamicuser_engine_lab.py' -v
          python -m py_compile tests/urano_i23_dynamicuser_engine_lab.py
