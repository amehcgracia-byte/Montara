name: URANO U13D private worker supervisor

on:
  push:
    branches:
      - fernando/urano-u13d-private-worker-supervisor
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u13d-supervisor.yml'

permissions:
  contents: read

jobs:
  supervisor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - name: Run all URANO unit and subprocess contracts
        run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - name: Syntax check frontend
        run: node --check urano/lab_ui/lab.js
