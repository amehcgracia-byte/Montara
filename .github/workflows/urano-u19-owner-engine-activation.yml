name: URANO U19 owner-to-private-Engine activation

on:
  push:
    branches:
      - fernando/urano-u19-owner-private-engine-activation
  pull_request:
    paths:
      - 'urano/owner_runtime_controller.py'
      - 'urano/http_owner_runtime.py'
      - 'urano/google_lab_app.py'
      - 'tests/test_urano_owner_runtime_http.py'
      - 'tests/test_urano_owner_runtime_docker.py'
      - '.github/workflows/urano-u19-owner-engine-activation.yml'

permissions:
  contents: read

jobs:
  owner-authorization-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OIDC laboratory dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify owner session and CSRF/authz against actual SQLite guards
        run: |
          python -m unittest discover -s tests -p 'test_urano_owner_runtime_http.py' -v
          python -m py_compile urano/owner_runtime_controller.py urano/http_owner_runtime.py urano/google_lab_app.py

  two-real-docker-owners-over-session-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OIDC contracts for signed fake Google principals
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Build pinned real Engine Docker image on disposable runner
        run: docker build --tag urano-u19-engine:local .
      - name: Export immutable image identifier
        run: |
          id=$(docker image inspect urano-u19-engine:local --format '{{.Id}}')
          case "$id" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$id" >> "$GITHUB_ENV"
      - name: Authenticated owner HTTP activation in two real Engine containers
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_urano_owner_runtime_docker.py' -v
