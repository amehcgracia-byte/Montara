name: FER I20 HTTP Owner to real Engine lab safety contracts
on:
  pull_request:
    paths:
      - 'urano/lab_cgroup_identity.py'
      - 'tests/urano_i20_oidc_to_real_engine_lab.py'
      - 'tests/test_urano_i20_oidc_real_engine_lab_contract.py'
      - '.github/workflows/fer-i20-http-real-engine-lab-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Assert namespace boundary and HTTP ownership without launching Linux units
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i20_oidc_real_engine_lab_contract.py tests/test_owner_engine_gateway.py
          python -m py_compile tests/urano_i20_oidc_to_real_engine_lab.py
