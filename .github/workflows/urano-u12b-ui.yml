name: URANO U12b isolated project UI contracts

on:
  push:
    branches:
      - fernando/urano-u12b-isolated-project-ui
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u12b-ui.yml'

permissions:
  contents: read

jobs:
  lab-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install 'Flask>=3.0,<4'
      - name: Execute all U10-U12b contracts
        run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - name: Syntax-check isolated browser script
        run: node --check urano/lab_ui/lab.js
