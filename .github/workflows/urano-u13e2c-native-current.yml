name: URANO U13E2C real sources contract on current main

on:
  push:
    branches:
      - fernando/urano-u13e2c-stage-current-native-real
  pull_request:
    paths:
      - 'tests/e2e_native_stage.py'
      - 'tests/native_real_media_input.py'
      - 'tests/test_native_real_media_input.py'
      - '.github/workflows/urano-u13e2c-native-current.yml'

permissions:
  contents: read

jobs:
  lightweight-real-input-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate real input and scratch isolation
        run: python -m unittest discover -s tests -p 'test_native_real_media_input.py' -v
      - name: Syntax check browser/Companion E2E (no footage in CI)
        run: |
          python -m py_compile tests/native_real_media_input.py
          python -m py_compile tests/e2e_native_stage.py
