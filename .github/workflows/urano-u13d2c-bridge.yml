name: URANO U13D2C Docker worker bridge

on:
  push:
    branches:
      - fernando/urano-u13d2c-container-worker-bridge
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u13d2c-bridge.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - run: node --check urano/lab_ui/lab.js

  container-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull and pin disposable Docker image
        run: |
          docker pull python:3.11-alpine
          image=$(docker image inspect python:3.11-alpine --format '{{index .RepoDigests 0}}')
          test -n "$image"
          echo "URANO_TEST_IMAGE_DIGEST=$image" >> "$GITHUB_ENV"
      - name: Isolated Docker worker + supervisor protocol with owner fencing
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_urano_docker_bridge.py' -v
