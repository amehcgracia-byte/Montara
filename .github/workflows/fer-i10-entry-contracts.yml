name: FER I10 entry links, owner choice and privacy
on:
  pull_request:
    paths:
      - 'urano/owner_beta_wsgi.py'
      - 'deployment/cloudflare-beta/public/index.html'
      - 'tests/test_c8_login_choice.py'
      - 'tools/cloudflare-beta/build.py'
      - '.github/workflows/fer-i10-entry-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-login-choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: C8 auth choice + Page safety
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_c8_login_choice.py tests/test_c8_google_owner_ui_bridge.py tests/test_c8_trusted_local_https.py
          python -m unittest discover -s tests -p test_c8_public_owner_entry.py -v
          python -m unittest discover -s tests -p test_c8_pages_integrated_build.py -v
          python tools/cloudflare-beta/build.py
          test "$(find dist -type f | wc -l)" -eq 2
