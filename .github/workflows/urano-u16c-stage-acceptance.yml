name: URANO U16C two-owner real Stage ingest and cancel-recovery

on:
  push:
    branches:
      - fernando/urano-u16c-two-owner-stage-acceptance
  pull_request:
    paths:
      - 'tests/urano_two_owner_stage_in_container.py'
      - 'tests/urano_two_owner_stage_docker_gate.py'
      - '.github/workflows/urano-u16c-stage-acceptance.yml'

permissions:
  contents: read

jobs:
  stage-two-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test runtime prerequisites
        run: |
          python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
          python -m py_compile tests/urano_two_owner_stage_in_container.py tests/urano_two_owner_stage_docker_gate.py
      - name: Build real pinned Engine image on disposable runner
        run: docker build -t urano-u16c-stage:local .
      - name: Select immutable local image ID
        run: |
          id=$(docker image inspect urano-u16c-stage:local --format '{{.Id}}')
          case "$id" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$id" >> "$GITHUB_ENV"
      - name: Stage actual ingest for both owners in parallel and cancel-recover
        run: PYTHONPATH=. python tests/urano_two_owner_stage_docker_gate.py
