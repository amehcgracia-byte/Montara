name: C7 isolated beta infrastructure readiness

on:
  push:
    branches:
      - fernando/c7-isolated-beta-deployment-preflight-20261109
    paths:
      - 'urano/c7_deployment_readiness.py'
      - 'tests/test_c7_isolated_beta_readiness.py'
      - 'docs/montara-c7-isolated-beta-deployment-plan.md'
      - '.github/workflows/c7-isolated-beta-readiness.yml'
  pull_request:
    paths:
      - 'urano/c7_deployment_readiness.py'
      - 'tests/test_c7_isolated_beta_readiness.py'
      - '.github/workflows/c7-isolated-beta-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-infrastructure-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test mandatory private beta safety gates (no deployment)
        run: |
          python -m unittest discover -s tests -p 'test_c7_isolated_beta_readiness.py' -v
          python -m py_compile urano/c7_deployment_readiness.py
      - name: Read-only GitHub runner inventory (not a deployment approval)
        run: python -m urano.c7_deployment_readiness
