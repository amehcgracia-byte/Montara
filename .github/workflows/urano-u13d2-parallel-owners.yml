name: URANO U13D2A parallel owner gate

on:
  push:
    branches:
      - fernando/urano-u13d2-concurrency-isolation-gates
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u13d2-parallel-owners.yml'

permissions:
  contents: read

jobs:
  concurrent-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - name: Verify two independent worker processes overlap and owners stay separate
        run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - run: node --check urano/lab_ui/lab.js
