name: C8 pinned HTTPS reverse-proxy and real Google owner entry
on:
  push:
    branches:
      - fernando/c8-public-beta-landing-pages-20261110
    paths:
      - 'urano/trusted_local_https.py'
      - 'tests/test_c8_trusted_local_https.py'
      - '.github/workflows/c8-trusted-https-owner.yml'
  pull_request:
    paths:
      - 'urano/trusted_local_https.py'
      - 'tests/test_c8_trusted_local_https.py'
      - '.github/workflows/c8-trusted-https-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight existing OAuth contract requirements
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify trusted local HTTPS scheme and Google identity
        run: |
          python -m unittest discover -s tests -p 'test_c8_trusted_local_https.py' -v
          python -m unittest discover -s tests -p 'test_c8_google_owner_ui_bridge.py' -v
          python -m py_compile urano/trusted_local_https.py
