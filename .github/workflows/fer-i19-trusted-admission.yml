name: FER I19 verified owner to fenced private job admission
on:
  pull_request:
    paths:
      - 'urano/trusted_job_admission.py'
      - 'tests/test_urano_trusted_job_admission.py'
      - '.github/workflows/fer-i19-trusted-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify ownership, durable reservation, cleanup and fencing
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_trusted_job_admission.py tests/test_urano_job_recovery_ledger.py tests/test_owner_engine_gateway.py
          python -m py_compile urano/trusted_job_admission.py
