name: FER I3 owner portal HTTPS and Google C8 (no Companion activation)
on:
  pull_request:
    paths:
      - 'urano/c6_beta_preflight.py'
      - 'urano/owner_beta_wsgi.py'
      - 'urano/trusted_local_https.py'
      - 'tests/test_c6_https_google_preflight.py'
      - 'tests/test_c8_google_owner_ui_bridge.py'
      - 'tests/test_c8_trusted_local_https.py'
      - '.github/workflows/fer-i3-owner-https.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated C1–C8 contract deps
        run: python -m pip install 'Flask>=3,<4' pytest -r requirements-urano-oidc.txt
      - name: Verify owner portal and HTTPS (Companion contract separately deferred)
        run: |
          python -m pytest -q \
            tests/test_c1_minimal_owner_api.py \
            tests/test_c4_owner_dashboard.py \
            tests/test_google_oidc_contract.py \
            tests/test_google_flow_contract.py \
            tests/test_c6_https_google_preflight.py \
            tests/test_c8_google_owner_ui_bridge.py \
            tests/test_c8_trusted_local_https.py \
            tests/test_urano_project_catalog.py \
            tests/test_urano_session_http.py \
            -k 'not test_companion_signed_receipt_only_for_exact_beta_origin'
      - name: Compile HTTPS owner application
        run: python -m py_compile urano/c6_beta_preflight.py urano/owner_beta_wsgi.py urano/trusted_local_https.py
