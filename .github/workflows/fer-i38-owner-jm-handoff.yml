name: FER I38 real JM project owner handoff contract
on:
  pull_request:
    paths:
      - 'urano/owner_jm_editor_handoff.py'
      - 'urano/engine_bindings.py'
      - 'urano/project_catalog.py'
      - 'tests/test_urano_owner_jm_editor_handoff.py'
      - '.github/workflows/fer-i38-owner-jm-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-project-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test requirements
        run: python -m pip install 'Flask>=3,<4'
      - name: Verify JM-to-Owner project binding and prior registry
        run: |
          python -m unittest discover -s tests -p test_urano_owner_jm_editor_handoff.py -v
          python -m unittest discover -s tests -p test_urano_engine_bindings.py -v
          python -m unittest discover -s tests -p test_urano_editor_project_bridge.py -v
          python -m py_compile urano/owner_jm_editor_handoff.py
