name: URANO U3C test-only original upload consent (FER)

on:
  pull_request:
    paths:
      - 'web/montara.js'
      - 'tests/urano_u3a_upload_baseline.cjs'
      - '.github/workflows/urano-u3a-upload-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-original-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check explicit test consent and blocked silent video uploads
        run: node tests/urano_u3a_upload_baseline.cjs
