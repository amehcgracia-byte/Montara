name: FER I6 hybrid telemetry and transport contracts
on:
  pull_request:
    paths:
      - 'tests/urano_hybrid_node_meter.py'
      - 'tests/urano_hybrid_merge_reports.py'
      - 'tests/urano_browser_transfer.py'
      - 'tests/urano_remote_hybrid_preflight.py'
      - 'tests/test_urano_hybrid_node_telemetry.py'
      - 'tests/test_urano_browser_transfer.py'
      - 'tests/test_urano_remote_hybrid_preflight.py'
      - '.github/workflows/fer-i6-hybrid-measurement-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline meter test dependencies
        run: python -m pip install pytest psutil
      - name: Verify telemetry and avoid false WAN claims
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q \
            tests/test_urano_hybrid_node_telemetry.py \
            tests/test_urano_browser_transfer.py \
            tests/test_urano_remote_hybrid_preflight.py
          python -m py_compile tests/urano_hybrid_node_meter.py tests/urano_hybrid_merge_reports.py tests/urano_browser_transfer.py tests/urano_remote_hybrid_preflight.py
