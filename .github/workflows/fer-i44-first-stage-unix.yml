name: FER original JM Stage first-draft Owner binding
on:
  pull_request:
    paths:
      - 'urano/owner_first_stage_wizard.py'
      - 'urano/private_jm_wsgi_socket.py'
      - 'tests/test_urano_owner_first_stage_wizard.py'
      - 'tests/test_urano_private_jm_wsgi_socket.py'
      - '.github/workflows/fer-i44-first-stage-unix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-jm-adapter-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local WSGI tests
        run: python -m pip install 'Flask>=3,<4'
      - name: Verify exact original JM first draft and Unix transport
        run: |
          python -m unittest discover -s tests -p test_urano_owner_first_stage_wizard.py -v
          python -m unittest discover -s tests -p test_urano_private_jm_wsgi_socket.py -v
          python -m py_compile urano/owner_first_stage_wizard.py urano/private_jm_wsgi_socket.py
