name: FER I25 restricted systemd broker policy contracts
on:
  pull_request:
    paths:
      - 'urano/restricted_systemd_broker.py'
      - 'tests/test_urano_i25_restricted_broker.py'
      - 'tests/urano_i25_restricted_real_engine_lab.py'
      - '.github/workflows/fer-i25-restricted-broker-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restricted-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify strict unit identity, cross-owner refusal and cgroup attestation
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i25_restricted_broker.py tests/test_urano_i24_durable_target_identity.py tests/test_urano_gateway_job_bridge.py
          python -m py_compile urano/restricted_systemd_broker.py tests/urano_i25_restricted_real_engine_lab.py
