name: URANO U16B two verified owners in private real Engine containers

on:
  push:
    branches:
      - fernando/urano-u16b-two-owner-private-engine
  pull_request:
    paths:
      - 'urano/container_isolation.py'
      - 'urano/container_worker_bridge.py'
      - 'urano/engine_worker_process.py'
      - 'urano/private_worker_supervisor.py'
      - 'urano/runtime_activation.py'
      - 'tests/test_google_private_engine_docker.py'
      - '.github/workflows/urano-u16b-two-private-engine.yml'

permissions:
  contents: read

jobs:
  two-verified-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated owner/JWT test dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Build Engine image from this commit and pinned submodules
        run: |
          git submodule status
          docker build --tag urano-u16b-engine-ci:local .
      - name: Resolve immutable local image ID
        run: |
          id=$(docker image inspect urano-u16b-engine-ci:local --format '{{.Id}}')
          case "$id" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$id" >> "$GITHUB_ENV"
      - name: Two signed fake Google identities and isolated live Engine containers
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_google_private_engine_docker.py' -v
      - name: Compile isolated worker and test code
        run: python -m py_compile urano/container_isolation.py urano/container_worker_bridge.py urano/engine_worker_process.py urano/private_worker_supervisor.py urano/runtime_activation.py tests/test_google_private_engine_docker.py
