name: URANO U12 lab authentication contract

on:
  push:
    branches:
      - fernando/urano-u12-local-auth-contract
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u12-auth.yml'

permissions:
  contents: read

jobs:
  isolated-auth-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP contract dependency
        run: python -m pip install 'Flask>=3.0,<4' -r requirements-urano-oidc.txt
      - name: Run all URANO contracts
        run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
