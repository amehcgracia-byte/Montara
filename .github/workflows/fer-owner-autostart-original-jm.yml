name: FER Owner original JM UI and first upload activation contracts
on:
  pull_request:
    paths:
      - 'urano/original_jm_owner_assets.py'
      - 'urano/private_owner_admission.py'
      - 'urano/private_broker_service.py'
      - 'urano/owner_broker_preview.py'
      - 'urano/minimal_owner_api.py'
      - 'urano/owner_first_stage_wizard.py'
      - 'tests/test_urano_original_jm_owner_assets.py'
      - 'tests/test_urano_owner_auto_engine_ensure.py'
      - 'tests/test_urano_owner_first_stage_wizard.py'
      - '.github/workflows/fer-owner-autostart-original-jm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-upload-owner-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install 'Flask>=3,<4'
      - name: Owner-authenticated UI, generation reuse and vetted Stage draft
        run: |
          python -m unittest discover -s tests -p test_urano_original_jm_owner_assets.py -v
          python -m unittest discover -s tests -p test_urano_owner_auto_engine_ensure.py -v
          python -m unittest discover -s tests -p test_urano_owner_first_stage_wizard.py -v
          python -m unittest discover -s tests -p test_urano_i27_owner_admission.py -v
          python -m unittest discover -s tests -p test_urano_i27_owner_http.py -v
          python -m py_compile urano/private_broker_service.py urano/original_jm_owner_assets.py
