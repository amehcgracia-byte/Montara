name: FER I21 durable owner-to-real-Engine bridge contracts
on:
  pull_request:
    paths:
      - 'urano/gateway_job_bridge.py'
      - 'urano/job_recovery_ledger.py'
      - 'tests/test_urano_gateway_job_bridge.py'
      - 'tests/urano_i21_signed_http_fenced_real_engine_lab.py'
      - '.github/workflows/fer-i21-durable-owner-engine-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify durable owner admission, fencing, lifecycle and cleanup
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_gateway_job_bridge.py tests/test_urano_job_recovery_ledger.py tests/test_owner_engine_gateway.py tests/test_urano_trusted_job_admission.py tests/test_urano_runtime_activation.py
          python -m py_compile urano/gateway_job_bridge.py tests/urano_i21_signed_http_fenced_real_engine_lab.py
