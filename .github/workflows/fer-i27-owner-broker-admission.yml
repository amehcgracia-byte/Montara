name: FER I27 verified Google Owner to private Engine admission
on:
  pull_request:
    paths:
      - 'urano/private_owner_admission.py'
      - 'urano/owner_broker_preview.py'
      - 'urano/private_broker_service.py'
      - 'urano/private_broker_worker.py'
      - 'urano/minimal_owner_api.py'
      - 'urano/owner_beta_wsgi.py'
      - 'urano/owner_dashboard.py'
      - 'tests/test_urano_i27_owner_admission.py'
      - 'tests/test_urano_i27_owner_http.py'
      - '.github/workflows/fer-i27-owner-broker-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Owner-to-broker session, CSRF, UUID and C8 regression contracts
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i27_owner_admission.py tests/test_urano_i27_owner_http.py tests/test_c1_minimal_owner_api.py tests/test_c8_google_owner_ui_bridge.py tests/test_c8_public_owner_entry.py tests/test_c4_owner_dashboard.py
          python -m py_compile urano/private_owner_admission.py urano/owner_broker_preview.py urano/private_broker_service.py urano/private_broker_worker.py
