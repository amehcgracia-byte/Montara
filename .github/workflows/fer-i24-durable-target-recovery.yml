name: FER I24 durable target and recovery offline contracts
on:
  pull_request:
    paths:
      - 'urano/job_recovery_ledger.py'
      - 'tests/test_urano_i24_durable_target_identity.py'
      - 'tests/urano_i24_dynamicuser_durable_job_lab.py'
      - '.github/workflows/fer-i24-durable-target-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Strict ownership, migration and restart fencing (no systemd)
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i24_durable_target_identity.py tests/test_urano_job_recovery_ledger.py tests/test_urano_gateway_job_bridge.py tests/test_urano_trusted_job_admission.py
          python -m py_compile urano/job_recovery_ledger.py tests/urano_i24_dynamicuser_durable_job_lab.py
