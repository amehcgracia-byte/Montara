name: FER I33 private Stage broker snapshot handoff
on:
  pull_request:
    paths:
      - 'urano/private_stage_snapshot_bridge.py'
      - 'urano/engine_worker_process.py'
      - 'urano/private_engine_route_contract.py'
      - 'urano/job_recovery_ledger.py'
      - 'urano/project_catalog.py'
      - 'tests/test_urano_private_stage_snapshot_bridge.py'
      - 'tests/test_urano_private_stage_snapshot.py'
      - 'tests/test_urano_private_engine_route_contract.py'
      - '.github/workflows/fer-i33-private-stage-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small isolated contract requirements
        run: python -m pip install 'Flask>=3,<4'
      - name: Verify private broker and worker Stage snapshot
        run: |
          python -m unittest discover -s tests -p test_urano_private_stage_snapshot_bridge.py -v
          python -m unittest discover -s tests -p test_urano_private_stage_snapshot.py -v
          python -m unittest discover -s tests -p test_urano_private_engine_route_contract.py -v
          python -m py_compile urano/private_stage_snapshot_bridge.py urano/engine_worker_process.py
