name: URANO U13C private Engine worker protocol

on:
  push:
    branches:
      - fernando/urano-u13c-worker-process-protocol
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u13c-worker.yml'

permissions:
  contents: read

jobs:
  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - name: Test all URANO contracts and private worker protocol
        run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - name: Syntax check
        run: |
          python -m py_compile urano/engine_worker_process.py
          node --check urano/lab_ui/lab.js

  real-engine-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Open synthetic old and new projects with real Engine in worker subprocess
        run: python tests/urano_real_engine_smoke.py
