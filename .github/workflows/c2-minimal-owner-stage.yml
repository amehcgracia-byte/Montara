name: C2 minimal signed owner to private Engine and Stage

on:
  push:
    branches:
      - fernando/c2-minimal-owner-stage-bridge-20261109
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_c2_google_to_private_engine.py'
      - 'tests/test_urano_owner_runtime_*.py'
      - 'tests/test_urano_stage_*.py'
      - 'tests/test_google_private_engine_docker.py'
      - 'tests/urano_u20_prepare_stage_inputs.py'
      - '.github/workflows/c2-minimal-owner-stage.yml'

permissions:
  contents: read

jobs:
  signed-login-to-private-engine-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal identity dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Login → real owner session → internal project worker + Stage/handoff contracts
        run: |
          python -m unittest discover -s tests -p 'test_c2_google_to_private_engine.py' -v
          python -m unittest discover -s tests -p 'test_c1_minimal_owner_api.py' -v
          python -m unittest discover -s tests -p 'test_urano_owner_runtime_http.py' -v
          python -m unittest discover -s tests -p 'test_urano_stage_*.py' -v
          python -m py_compile urano/minimal_owner_api.py urano/container_worker_bridge.py urano/engine_worker_process.py

  two-real-stage-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal signed-identity test dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Build immutable private Engine image on disposable runner
        run: docker build --tag montara-c2-stage:local .
      - name: Obtain pinned Docker image
        run: |
          id=$(docker image inspect montara-c2-stage:local --format '{{.Id}}')
          case "$id" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$id" >> "$GITHUB_ENV"
      - name: Two owners, independent private Engine containers and real Stage DONE
        env:
          PYTHONPATH: .:tests
        run: python -m unittest discover -s tests -p 'test_urano_owner_runtime_docker.py' -v
