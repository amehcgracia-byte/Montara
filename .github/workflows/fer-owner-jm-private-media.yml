name: FER Owner JM private media transport and worker runtime
on:
  pull_request:
    paths:
      - 'urano/full_jm_worker.py'
      - 'urano/private_broker_worker.py'
      - 'urano/private_broker_service.py'
      - 'urano/private_editor_fd_handoff.py'
      - 'urano/private_editor_connect_admission.py'
      - 'urano/owner_private_http_client.py'
      - 'urano/original_jm_owner_assets.py'
      - 'urano/first_valid_upload_gate.py'
      - 'urano/restricted_systemd_broker.py'
      - 'tests/test_urano_private_editor_fd_handoff.py'
      - 'tests/test_urano_private_editor_connect_owner.py'
      - 'tests/test_urano_owner_private_http_client.py'
      - 'tests/test_urano_worker_resource_profile.py'
      - 'tests/test_urano_first_valid_upload_gate.py'
      - '.github/workflows/fer-owner-jm-private-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-transport-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum local contracts
        run: python -m pip install 'Flask>=3,<4'
      - name: Check Owner authorizations, private FD handoff, media streaming and resource profiles
        run: |
          python -m unittest discover -s tests -p test_urano_private_editor_fd_handoff.py -v
          python -m unittest discover -s tests -p test_urano_private_editor_connect_owner.py -v
          python -m unittest discover -s tests -p test_urano_owner_private_http_client.py -v
          python -m unittest discover -s tests -p test_urano_worker_resource_profile.py -v
          python -m unittest discover -s tests -p test_urano_first_valid_upload_gate.py -v
          python -m unittest discover -s tests -p test_urano_i25_restricted_broker.py -v
          python -m unittest discover -s tests -p test_urano_i27_owner_admission.py -v
          python -m py_compile urano/full_jm_worker.py urano/private_broker_worker.py urano/private_broker_service.py urano/private_editor_fd_handoff.py urano/owner_private_http_client.py
