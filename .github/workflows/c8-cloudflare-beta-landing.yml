name: C8 static Cloudflare beta landing acceptance
on:
  push:
    branches:
      - fernando/c8-public-beta-landing-pages-20261110
    paths:
      - 'deployment/cloudflare-beta/**'
      - 'tools/cloudflare-beta/**'
      - '.github/workflows/c8-cloudflare-beta-landing.yml'
  pull_request:
    paths:
      - 'deployment/cloudflare-beta/**'
      - 'tools/cloudflare-beta/**'
      - '.github/workflows/c8-cloudflare-beta-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and reject unsafe login/backend links
        run: |
          python3 tools/cloudflare-beta/build.py
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          text=Path("dist/index.html").read_text()
          class Checker(HTMLParser):
              def __init__(self): super().__init__(); self.buttons=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="button": self.buttons.append(dict(attrs))
                  if tag=="script": self.scripts.append(dict(attrs))
          c=Checker();c.feed(text)
          assert len(c.buttons)==1 and "disabled" in c.buttons[0]
          assert not c.scripts
          assert 'form-action: false' not in text
          h=Path("dist/_headers").read_text()
          assert "Content-Security-Policy" in h and "frame-ancestors 'none'" in h
          print("landing test: no active login or client JS")
          PY
