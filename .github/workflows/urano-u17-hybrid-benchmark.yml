name: URANO U17 hybrid web-server-local Companion truth gate

on:
  push:
    branches:
      - fernando/urano-u17-hybrid-topology-benchmark
  pull_request:
    paths:
      - 'tests/urano_hybrid_benchmark.py'
      - 'tests/test_urano_hybrid_benchmark.py'
      - '.github/workflows/urano-u17-hybrid-benchmark.yml'

permissions:
  contents: read

jobs:
  topology-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Topology and benchmark-contract checks
        run: python -m unittest discover -s tests -p 'test_urano_hybrid_benchmark.py' -v
      - name: Python syntax
        run: python -m py_compile tests/urano_hybrid_benchmark.py tests/test_urano_hybrid_benchmark.py

  dual-native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser, FFmpeg and Python prerequisites
        run: |
          python -m pip install -r requirements.txt psutil
          python -m playwright install --with-deps chromium
          python -m playwright install chrome
          ffmpeg -version
          ffprobe -version
      - name: Two synthetic isolated web + server + local Companion E2Es in parallel
        env:
          MONTARA_TEST_BROWSER_CHANNEL: chrome
        run: python tests/urano_hybrid_benchmark.py --clients 2 --mode shared-runner --output e2e-output/hybrid-two
      - name: Show bounded CPU and result report, no original-media copies
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('e2e-output/hybrid-two/hybrid-report.json')
          if p.is_file(): print(json.dumps(json.loads(p.read_text()), indent=2))
          else:
              for log in sorted(Path('e2e-output/hybrid-two').glob('client-*.log')):
                  print(log.name, log.read_text(errors='replace')[-4000:])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: urano-hybrid-two-local-stacks
          retention-days: 3
          path: |
            e2e-output/hybrid-two/hybrid-report.json
            e2e-output/hybrid-two/client-*.log
            e2e-output/hybrid-two/client-*/summary.json
            e2e-output/hybrid-two/client-*/native-result.png
