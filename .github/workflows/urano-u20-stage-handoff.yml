name: URANO U20 authenticated Stage and local Companion descriptor

on:
  push:
    branches:
      - fernando/urano-u20-stage-job-and-companion-handoff
  pull_request:
    paths:
      - 'urano/engine_worker_process.py'
      - 'urano/container_worker_bridge.py'
      - 'urano/owner_runtime_controller.py'
      - 'urano/http_owner_runtime.py'
      - 'urano/companion_handoff.py'
      - 'urano/google_lab_app.py'
      - 'tests/urano_u20_prepare_stage_inputs.py'
      - 'tests/test_urano_stage_handoff_http.py'
      - 'tests/test_urano_stage_worker_protocol.py'
      - 'tests/test_urano_owner_runtime_docker.py'
      - '.github/workflows/urano-u20-stage-handoff.yml'

permissions:
  contents: read

jobs:
  auth-and-pathless-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal OIDC and Flask dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify fixed Stage commands, owner checks and safe Companion descriptor
        run: |
          python -m unittest discover -s tests -p 'test_urano_stage_*.py' -v
          python -m unittest discover -s tests -p 'test_urano_owner_runtime_http.py' -v
          python -m py_compile urano/engine_worker_process.py urano/container_worker_bridge.py urano/http_owner_runtime.py urano/companion_handoff.py tests/urano_u20_prepare_stage_inputs.py

  two-actual-stage-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OIDC and Flask contracts
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Build pinned real Engine locally in disposable GitHub runner
        run: docker build --tag urano-u20-real-engine:local .
      - name: Select immutable sha256 Docker image ID
        run: |
          id=$(docker image inspect urano-u20-real-engine:local --format '{{.Id}}')
          case "$id" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$id" >> "$GITHUB_ENV"
      - name: Two signed owners run real Stage ingest and receive private safe descriptors
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_urano_owner_runtime_docker.py' -v
