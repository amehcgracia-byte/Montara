name: FER I36 private Stage HTTP-to-broker admission
on:
  pull_request:
    paths:
      - 'urano/owner_broker_preview.py'
      - 'urano/private_broker_service.py'
      - 'urano/private_stage_owner_admission.py'
      - 'urano/private_stage_snapshot_bridge.py'
      - 'urano/private_stage_payload.py'
      - 'urano/private_stage_unix_transport.py'
      - 'tests/test_urano_i36_stage_owner_http.py'
      - 'tests/urano_i35_real_engine_stage_socket_lab.py'
      - '.github/workflows/fer-i36-stage-owner-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-stage-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install 'Flask>=3,<4'
      - name: Verify independent owner auth, broker and real local Unix transport
        run: |
          python -m unittest discover -s tests -p test_urano_i36_stage_owner_http.py -v
          python -m unittest discover -s tests -p test_urano_i27_owner_admission.py -v
          python -m unittest discover -s tests -p test_urano_i27_owner_http.py -v
          python -m unittest discover -s tests -p test_urano_private_stage_unix_transport.py -v
          python -m unittest discover -s tests -p test_urano_private_stage_socket_bridge.py -v
          python -m py_compile urano/private_broker_service.py urano/private_stage_owner_admission.py urano/owner_broker_preview.py
