name: C6 HTTPS Google and Companion exact-origin preflight

on:
  push:
    branches:
      - fernando/c6-https-google-companion-preflight-20261109
  pull_request:
    paths:
      - 'urano/c6_beta_preflight.py'
      - 'tests/test_c6_https_google_preflight.py'
      - 'companion/companion.py'
      - '.github/workflows/c6-https-google-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  https-beta-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated existing Google OIDC dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Validate beta origin and Companion pairing without real credentials
        run: |
          python -m unittest discover -s tests -p 'test_c6_https_google_preflight.py' -v
          python -m unittest discover -s tests -p 'test_google_oidc_contract.py' -v
          python -m unittest discover -s tests -p 'test_google_flow_contract.py' -v
          python -m py_compile urano/c6_beta_preflight.py companion/companion.py
      - name: Verify Companion browser syntax
        run: node --check web/companion.js
