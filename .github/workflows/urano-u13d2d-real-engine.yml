name: URANO U13D2D real Engine in private Docker containers

on:
  push:
    branches:
      - fernando/urano-u13d2d-real-engine-container
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - '.github/workflows/urano-u13d2d-real-engine.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - run: python -m unittest discover -s tests -p 'test_urano_*.py' -v
      - run: node --check urano/lab_ui/lab.js

  engine-in-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build existing, pinned Montara Engine container
        run: docker build --tag urano-real-engine-ci:latest .
      - name: Get immutable local image ID; no registry or mutable tag in worker
        run: |
          image=$(docker image inspect urano-real-engine-ci:latest --format '{{.Id}}')
          case "$image" in sha256:*) ;; *) exit 1 ;; esac
          echo "URANO_TEST_IMAGE_ID=$image" >> "$GITHUB_ENV"
      - name: Two private Engine instances open synthetic projects without cross-user access
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_urano_real_engine_docker.py' -v
