name: JM motion and native 360 integration
on:
  push:
    branches:
      - integration/jm-motion-native-cache-20261109
  pull_request:
    paths:
      - engine
      - web/cut-editor.js
      - companion/video_recipe.py
      - tests/stage-shot-isolation.test.cjs
      - .github/workflows/jm-motion-integration.yml
jobs:
  jm-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/stage-shot-isolation.test.cjs tests/native-render-progress.test.cjs
      - run: python -m py_compile companion/video_recipe.py companion/local_video.py companion/video_jobs.py engine/server/edit_timeline.py engine/core/stages/export.py
      - run: |
          python -m pip install pytest
          PYTHONPATH=companion:engine pytest -q tests/test_native_spherical_cache.py
