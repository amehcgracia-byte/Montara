name: FER I18 crash-safe owner job ledger contracts
on:
  pull_request:
    paths:
      - 'urano/job_recovery_ledger.py'
      - 'tests/test_urano_job_recovery_ledger.py'
      - '.github/workflows/fer-i18-job-ledger-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify concurrency, ownership, fencing and restart recovery
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_job_recovery_ledger.py tests/test_owner_engine_gateway.py tests/test_urano_runtime_activation.py
          python -m py_compile urano/job_recovery_ledger.py
