name: URANO U13E2 real-media preflight (no private footage in CI)

on:
  push:
    branches:
      - fernando/urano-u13e2-real-media-preflight
  pull_request:
    paths:
      - 'urano/real_media_preflight.py'
      - 'tests/test_urano_real_media_preflight.py'
      - '.github/workflows/urano-u13e2-preflight.yml'

permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify file safety, codec report, free-space gate, no source writes
        run: python -m unittest -v tests/test_urano_real_media_preflight.py
      - name: Syntax check
        run: |
          python -m py_compile urano/real_media_preflight.py
          python -m py_compile tests/test_urano_real_media_preflight.py
