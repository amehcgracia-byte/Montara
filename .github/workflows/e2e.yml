name: Montara end-to-end (Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Run every journey or only the private container acceptance
        type: choice
        default: all
        options: [all, container]

concurrency:
  group: montara-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'container'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [stage, push, mix, session]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ffmpeg >/dev/null || ! fc-match DejaVuSans >/dev/null; then
            # The runner's Azure mirror intermittently takes minutes per MB.
            # Use Ubuntu's signed archive without changing the runner's sources.
            montara_sources="$RUNNER_TEMP/montara-sources.list"
            printf '%s\n' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > "$montara_sources"
            apt_options=(-o "Dir::Etc::sourcelist=$montara_sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=2 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 -o Dpkg::Use-Pty=0)
            sudo -E apt-get "${apt_options[@]}" update
            sudo -E apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version
      - name: Install Montara
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        if: matrix.mode == 'session'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: deployment/vercel/package-lock.json
      - name: Preview deployment and storage tests
        if: matrix.mode == 'session'
        run: |
          npm ci --prefix deployment/vercel --ignore-scripts
          npm run build --prefix deployment/vercel
          node --test tests/test_preview_runtime.mjs
      - name: Montara regression tests
        if: matrix.mode == 'session'
        run: python -m pytest tests -q
      - name: ${{ matrix.mode }} through the real interface
        if: matrix.mode != 'session'
        run: python tests/e2e_journey.py --mode ${{ matrix.mode }} --output e2e-output
      - name: Session detection, common mix, exports and resumable upload
        if: matrix.mode == 'session'
        run: python tests/e2e_session.py --output e2e-output/session --stdout-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        # Diagnostic storage is optional; test and export failures remain fatal.
        continue-on-error: true
        with:
          name: montara-e2e-${{ matrix.mode }}
          retention-days: 3
          path: |
            e2e-output/**/*.png
            e2e-output/**/render.mp4
            e2e-output/**/*.mp3
            e2e-output/summary.json
            e2e-output/**/summary.json
            e2e-output/server-*.log
            e2e-output/**/server.log

  private-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Private test credentials and build identity
        shell: bash
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf 'MONTARA_PREVIEW_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'MONTARA_BUILD_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'MONTARA_ENGINE_SHA=%s\n' "$(git -C engine rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'MONTARA_MIXER_SHA=%s\n' "$(git -C mixer rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build exact private server image
        run: docker compose -p montara-ci build
      - name: Check dependencies, data volume, fonts and CPU export
        run: |
          mkdir -p server-check-output
          docker compose -p montara-ci run --rm -T montara python -m deploy.preflight --server --data /data --smoke --output /data/server-check.json
      - name: Prepare CPU speech model and exercise real decoding
        run: docker compose -p montara-ci run --rm -T montara python -m deploy.warmup --data /data
      - name: Start private host
        run: |
          docker compose -p montara-ci up -d
          for attempt in $(seq 1 90); do
            if docker compose -p montara-ci exec -T montara python -m deploy.healthcheck; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Install browser client
        run: |
          pip install playwright==1.64.1 pillow
          python -m playwright install --with-deps chromium
          if ! command -v ffprobe >/dev/null; then
            montara_sources="$RUNNER_TEMP/montara-client-sources.list"
            printf '%s\n' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
              'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > "$montara_sources"
            apt_options=(-o "Dir::Etc::sourcelist=$montara_sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=2 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg
          fi
          ffprobe -version
      - name: Real Stage through the authenticated container
        run: python tests/e2e_journey.py --mode stage --base-url http://127.0.0.1:8090 --output server-check-output --stdout-screenshots
      - name: Preserve resource peak before restarting the container
        if: always()
        run: docker compose -p montara-ci exec -T montara cat /sys/fs/cgroup/memory.peak > server-check-output/container-memory-peak-before-restart-bytes.txt
      - name: Restart and verify persisted project and export
        run: |
          docker compose -p montara-ci restart
          for attempt in $(seq 1 90); do
            if docker compose -p montara-ci exec -T montara python -m deploy.healthcheck; then break; fi
            sleep 2
          done
          docker compose -p montara-ci exec -T montara python -m deploy.restart_check
      - name: Save bounded reports and resource counters
        if: always()
        run: |
          container=$(docker compose -p montara-ci ps -q montara)
          if [ -n "$container" ]; then
            docker cp "$container:/data/server-check.json" server-check-output/server-check.json || true
            docker cp "$container:/data/whisper-warmup.json" server-check-output/whisper-warmup.json || true
            docker logs --tail 120 "$container" > server-check-output/server.log 2>&1 || true
          fi
          python - <<'PY'
          from pathlib import Path
          for name in ('server-check.json', 'whisper-warmup.json', 'summary.json', 'container-memory-peak-before-restart-bytes.txt'):
              path = Path('server-check-output') / name
              if path.is_file() and path.stat().st_size < 65536:
                  print('MONTARA_SERVER_REPORT ' + name + ' ' + path.read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: montara-private-container
          retention-days: 3
          path: |
            server-check-output/**/*.json
            server-check-output/**/*.txt
            server-check-output/**/*.png
            server-check-output/server.log
      - name: Remove only the isolated CI container and volume
        if: always()
        run: docker compose -p montara-ci down -v
