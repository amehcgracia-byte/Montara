name: URANO U15 isolated Google OIDC security contracts

on:
  push:
    branches:
      - fernando/urano-u15-google-oidc-trust-contract
  pull_request:
    paths:
      - 'urano/google_oidc.py'
      - 'urano/google_owner.py'
      - 'tests/test_google_oidc_contract.py'
      - 'requirements-urano-oidc.txt'
      - '.github/workflows/urano-u15-google-oidc.yml'

permissions:
  contents: read

jobs:
  google-identity-offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional verification library
        run: python -m pip install -r requirements-urano-oidc.txt
      - name: Offline fake-signed ID token and owner isolation tests
        run: python -m unittest discover -s tests -p 'test_google_oidc_contract.py' -v
      - name: Syntax contracts
        run: python -m py_compile urano/google_oidc.py urano/google_owner.py tests/test_google_oidc_contract.py
