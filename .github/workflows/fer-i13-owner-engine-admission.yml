name: FER I13 verified owner to private Engine admission
on:
  pull_request:
    paths:
      - 'urano/owner_engine_gateway.py'
      - 'urano/minimal_owner_api.py'
      - 'tests/test_owner_engine_gateway.py'
      - '.github/workflows/fer-i13-owner-engine-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install explicit OIDC and test requirements
        run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify owner, project, runtime and failure gates
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q \
            tests/test_owner_engine_gateway.py \
            tests/test_c1_minimal_owner_api.py \
            tests/test_c8_google_owner_ui_bridge.py \
            tests/test_urano_engine_bindings.py \
            tests/test_urano_runtime_activation.py
          python -m py_compile urano/owner_engine_gateway.py urano/minimal_owner_api.py
