name: C8 private Google owner gateway via Cloudflare Workers VPC
on:
  push:
    branches:
      - fernando/c8-public-beta-landing-pages-20261110
    paths:
      - 'deployment/cloudflare-owner/**'
      - '.github/workflows/c8-owner-vpc-gateway.yml'
  pull_request:
    paths:
      - 'deployment/cloudflare-owner/**'
      - '.github/workflows/c8-owner-vpc-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolation contracts (no Cloudflare deploy)
        run: |
          node --check deployment/cloudflare-owner/worker.mjs
          node --test deployment/cloudflare-owner/gateway.test.mjs
