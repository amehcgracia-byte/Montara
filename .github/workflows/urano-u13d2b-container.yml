name: URANO U13D2B container filesystem isolation

on:
  push:
    branches:
      - fernando/urano-u13d2b-container-isolation
  pull_request:
    paths:
      - 'urano/**'
      - 'tests/test_urano_*.py'
      - 'tests/urano_docker_isolation_smoke.py'
      - '.github/workflows/urano-u13d2b-container.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Flask>=3.0,<4'
      - run: python -m unittest discover -s tests -p 'test_urano_*.py' -v

  docker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull and pin disposable Docker test image
        shell: bash
        run: |
          docker pull python:3.11-alpine
          image=$(docker image inspect python:3.11-alpine --format '{{index .RepoDigests 0}}')
          test -n "$image"
          echo "URANO_TEST_IMAGE_DIGEST=$image" >> "$GITHUB_ENV"
      - name: Parallel isolated containers cannot see each other's synthetic data
        run: python tests/urano_docker_isolation_smoke.py
