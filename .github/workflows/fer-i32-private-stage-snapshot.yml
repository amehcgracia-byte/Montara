name: FER I32 private Stage worker snapshot
on:
  pull_request:
    paths:
      - 'urano/engine_worker_process.py'
      - 'urano/private_engine_route_contract.py'
      - 'tests/test_urano_private_stage_snapshot.py'
      - 'tests/test_urano_private_engine_route_contract.py'
      - '.github/workflows/fer-i32-private-stage-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-private-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify private worker snapshot and route admission
        run: |
          python -m unittest discover -s tests -p test_urano_private_stage_snapshot.py -v
          python -m unittest discover -s tests -p test_urano_private_engine_route_contract.py -v
          python -m py_compile urano/engine_worker_process.py urano/private_engine_route_contract.py
