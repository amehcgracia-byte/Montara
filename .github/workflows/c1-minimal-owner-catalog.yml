name: C1 minimal Google owner + existing project catalog

on:
  push:
    branches:
      - fernando/c1-minimal-google-owner-sessions-20261109
  pull_request:
    paths:
      - 'urano/google_oidc.py'
      - 'urano/google_owner.py'
      - 'urano/google_flow.py'
      - 'urano/minimal_owner_api.py'
      - 'requirements-urano-oidc.txt'
      - 'tests/test_google_oidc_contract.py'
      - 'tests/test_google_flow_contract.py'
      - 'tests/test_c1_minimal_owner_api.py'
      - '.github/workflows/c1-minimal-owner-catalog.yml'

permissions:
  contents: read

jobs:
  owner-identity-and-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only private beta identity contract dependencies
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify signed OIDC, PKCE/session and integration with existing catalog
        run: |
          python -m unittest discover -s tests -p 'test_google_oidc_contract.py' -v
          python -m unittest discover -s tests -p 'test_google_flow_contract.py' -v
          python -m unittest discover -s tests -p 'test_c1_minimal_owner_api.py' -v
          python -m py_compile urano/google_oidc.py urano/google_owner.py urano/google_flow.py urano/minimal_owner_api.py
