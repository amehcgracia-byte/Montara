name: Saturn 18 isolated full AAB with QA decoder passthrough
# QA runner includes encoder-fallback decoder attempts in intervention count.
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Python runtime
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Full isolated Stage-plan A/A/B with QA-only decoder control
        timeout-minutes: 52
        run: python experiments/saturno_18/full_gate_passthrough.py
      - name: Print compact preserved result if available
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/saturno-full18/REPORT.json')
          if not path.exists():
              print("SATURNO18_REPORT_NOT_WRITTEN")
          else:
              r=json.loads(path.read_text())
              print("SATURNO18_PRESERVED="+json.dumps({
                  'status':r.get('status'),
                  'AA':{k:r.get('AA',{}).get(k) for k in ('same_index_exact','video_exact','audio_exact','timeline_exact','file_exact')},
                  'AB':{k:r.get('AB',{}).get(k) for k in ('same_index_exact','video_exact','audio_exact','timeline_exact','file_exact')},
                  'summaries':r.get('summaries'),
                  'error':r.get('error')
              },separators=(',',':')))
          PY
