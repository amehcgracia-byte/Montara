name: Saturn 12 full fixed Stage plan A-A and isolated A-B
# Real fixed plan already captured. Does not repeat the UI, ingest, sync or creative edit.
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete native renderer runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Full forced A-A then isolated B, including native 360 encoder control
        run: python experiments/saturno_10/full_gate.py
      - name: Preserve scientific gate and worker errors
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/saturno-full12/REPORT.json")
          if p.is_file():
              print("EVIDENCE_FILE=" + str(p), flush=True)
              print(p.read_text(), flush=True)
          PY
