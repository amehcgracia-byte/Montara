name: Saturn 11 real Stage packet and colour preflight
# No rerun of the successful Stage or isolated flat render.
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install decoder and native analysis runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Packet, decoded-window and native-colour preflight of exact Stage plan
        run: python experiments/saturno_10/packet_preflight.py
      - name: Preserve structured preflight in logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/saturno-packet-preflight/REPORT.json")
          if p.is_file():
              print("EVIDENCE_FILE=" + str(p), flush=True)
              print(p.read_text(), flush=True)
          PY
