name: Saturn 16 six-window fps_mode decoder gate
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg only
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
      - name: Test passthrough in six audited 360 windows
        timeout-minutes: 3
        run: python experiments/saturno_16/six_windows.py
      - name: Print preserved evidence if diagnostic was interrupted
        if: failure()
        run: |
          if test -f /tmp/saturno16-decoder/REPORT.json; then
            cat /tmp/saturno16-decoder/REPORT.json
          fi
