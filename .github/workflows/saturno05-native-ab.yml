name: Saturn 10 Stage journey with observed selector controls
# Stage only: reduced video/audio gate already passed in run 40881393749.
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Stage runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Existing real Stage journey with two browser-only selector corrections
        env:
          SATURNO_STAGE_USE_PRIOR_ORIGINAL: '1'
        run: python experiments/saturno_09/stage_probe.py
      - name: Preserve scientific gate and evidence in logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/saturno09-stage/REPORT.json")
          if p.is_file():
              print("EVIDENCE_FILE=" + str(p), flush=True)
              print(p.read_text(), flush=True)
          PY
