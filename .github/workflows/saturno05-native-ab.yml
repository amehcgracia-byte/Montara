name: Saturn 09 reduced isolated package and Stage diagnosis
# One consolidated execution. Code/docs-only commits do not trigger this job.
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime for the consolidated controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          ffmpeg -version
      - name: Reduced video and audio package with original paths and A caches masked
        run: python experiments/saturno_09/reduced_gate.py
      - name: Diagnose real Stage journey and predeclared browser-only selector control
        if: always()
        run: python experiments/saturno_09/stage_probe.py
      - name: Preserve structured evidence in logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for folder in ("/tmp/saturno09", "/tmp/saturno09-stage"):
              p = Path(folder) / "REPORT.json"
              if p.is_file():
                  print(f"EVIDENCE_FILE={p}", flush=True)
                  print(p.read_text(), flush=True)
          PY
