name: Saturn 17 native 360 reprojection AAB
on:
  push:
    branches:
      - fernando/continuacion-montara
    paths:
      - .github/workflows/saturno05-native-ab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and native reprojection dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
          python -m pip install numpy opencv-python-headless
      - name: Test actual Zucker reprojection of segment 0003 A/A/B
        timeout-minutes: 8
        run: python experiments/saturno_17/reprojection_gate.py
      - name: Print preserved evidence if diagnostic was interrupted
        if: failure()
        run: |
          if test -f /tmp/saturno17-reprojection/REPORT.json; then
            cat /tmp/saturno17-reprojection/REPORT.json
          fi
