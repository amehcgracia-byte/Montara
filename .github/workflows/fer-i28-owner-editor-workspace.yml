name: FER I28 private Owner editor workspace contracts
on:
  pull_request:
    paths:
      - 'urano/owner_editor_workspace.py'
      - 'urano/minimal_owner_api.py'
      - 'urano/owner_dashboard.py'
      - 'tests/test_urano_i28_owner_editor.py'
      - '.github/workflows/fer-i28-owner-editor-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify private workspace, owner isolation and recipe revision
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i28_owner_editor.py tests/test_urano_i27_owner_http.py tests/test_urano_i27_owner_admission.py tests/test_c1_minimal_owner_api.py tests/test_c4_owner_dashboard.py tests/test_c8_google_owner_ui_bridge.py
          python -m py_compile urano/owner_editor_workspace.py urano/minimal_owner_api.py urano/owner_dashboard.py

