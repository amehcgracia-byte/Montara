name: URANO U15B isolated Google authorization PKCE

on:
  push:
    branches:
      - fernando/urano-u15b-oidc-authorization-flow
  pull_request:
    paths:
      - 'urano/google_flow.py'
      - 'tests/test_google_flow_contract.py'
      - '.github/workflows/urano-u15b-google-flow.yml'

permissions:
  contents: read

jobs:
  google-code-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies only
        run: python -m pip install 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Verify offline signed Google ID token flow and negative cases
        run: python -m unittest discover -s tests -p 'test_google_*contract.py' -v
      - name: Syntax check
        run: python -m py_compile urano/google_flow.py tests/test_google_flow_contract.py
