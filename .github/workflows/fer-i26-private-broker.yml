name: FER I26 private broker socket and lifecycle contracts
on:
  pull_request:
    paths:
      - 'urano/private_broker_service.py'
      - 'urano/private_broker_worker.py'
      - 'urano/private_broker_client.py'
      - 'tests/test_urano_i26_private_broker.py'
      - '.github/workflows/fer-i26-private-broker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'Flask>=3,<4' -r requirements-urano-oidc.txt
      - name: Socket peer credentials, frame rejection and legacy broker policy
        env:
          PYTHONPATH: tests
        run: |
          python -m pytest -q tests/test_urano_i26_private_broker.py tests/test_urano_i25_broker_ipc.py tests/test_urano_i25_restricted_broker.py
          python -m py_compile urano/private_broker_service.py urano/private_broker_worker.py urano/private_broker_client.py
